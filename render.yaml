services:
  - type: web
    name: zen-ledger-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PERSISTENCE
        value: mongo
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: APP_ORIGIN
        sync: false
