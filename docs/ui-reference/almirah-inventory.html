<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Almirah Factory Inventory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#120c22;--bg2:#140f24;--card:#211a3d;--line:#2e2653;--line2:#3a3166;--ac:#7c5cfc;--acs:rgba(124,92,252,.16);--aci:#b8a6ff;--tx:#ece9f7;--mu:#a9a3c9;--fa:#8a83ad;--gr:#34d399;--am:#f5b73b;--rd:#f26d6d;--scr:rgba(8,5,18,.65)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#faf9f5;--bg2:#f3f0e8;--card:#fff;--line:#e6e1d6;--line2:#d4cebf;--ac:#6a48e8;--acs:rgba(106,72,232,.1);--aci:#5a3bd0;--tx:#141413;--mu:#5f5b72;--fa:#7d7890;--gr:#0f8a5f;--am:#b97a00;--rd:#d23f3f;--scr:rgba(20,20,19,.4)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg)}

.eb{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--aci);font-weight:600}h1{font-size:clamp(24px,3.4vw,34px);margin-top:4px}
.sub{margin-top:6px;font-size:14px;color:var(--mu);max-width:75ch}.hint{color:var(--fa);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn.g{background:transparent;border:1px solid var(--line2);color:var(--tx)}.btn.s{padding:4px 10px;font-size:12.5px;border-radius:8px}.btn.ok{background:#1f9d63}
.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.add button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}.add button:hover{border-color:var(--ac)}.add b{display:block;font-size:14px}.add small{color:var(--mu);font-size:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin:16px 0 14px}.tab{padding:9px 14px;border:0;background:none;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}.tab.on{color:var(--tx);border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0;margin-bottom:14px}.card h3{font-size:15px;font-weight:600;font-family:inherit}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px;margin-bottom:14px}.g2>.card{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px}.tile{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px}.big{font:700 24px "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}.c-red{background:rgba(242,109,109,.15);color:var(--rd)}.c-amber{background:rgba(245,183,59,.15);color:var(--am)}.c-green{background:rgba(52,211,153,.14);color:var(--gr)}.c-grey{background:var(--acs);color:var(--aci)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}th{font-size:11.5px;color:var(--fa);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.r{text-align:right;font-variant-numeric:tabular-nums}th.r{text-align:right}

.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.row:first-of-type{border-top:0}.row small{display:block;color:var(--fa);font-size:12px}.dot{width:9px;height:9px;border-radius:50%}
.lr{display:grid;grid-template-columns:minmax(110px,220px) 1fr 100px;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}.lr.t{border-top:1px solid var(--line2);font-weight:700}.lr .bar{height:12px;border-radius:4px}.lr .bar i{border-radius:4px}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--am),var(--gr))}
input,select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;width:100%}table input{width:90px;padding:4px 8px}label{display:block;font-size:11.5px;color:var(--fa);margin:8px 0 3px}
.scrim{position:fixed;inset:0;background:var(--scr);z-index:6}.modal{position:fixed;left:50%;top:40px;transform:translateX(-50%);width:min(680px,94vw);max-height:calc(100% - 80px);overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:18px;z-index:7;padding:18px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1f9d63;color:#fff;border-radius:12px;padding:10px 18px;font-weight:600;z-index:9;max-width:92vw}[hidden]{display:none!important}
@media(max-width:520px){.f2{grid-template-columns:1fr}.lr{grid-template-columns:1fr 80px}.lr .bar{display:none}}
</style></head><body><div class="pg">
<header class="top"><div><div class="eb">Almirah factory · Inventory</div><h1>Every rupee in and out, and what each almirah really earns</h1><p class="sub">Raw material stock, purchases, expenses, scrap and the bill of materials, so you see true profit per almirah. Your entries are saved in this browser.</p></div><button class="btn g s" id="rs" data-act="reset">Reset sample data</button></header>
<div class="add"><button data-act="m:buy"><b>Record purchase</b><small>steel, paint, hardware</small></button><button data-act="m:exp"><b>Add expense</b><small>or income, or cash taken</small></button><button data-act="m:count"><b>Count stock</b><small>physical count</small></button><button data-act="m:scrap"><b>Log scrap</b><small>cut-offs, damage, missing</small></button><button data-act="m:item"><b>Add stock item</b><small>new raw material</small></button></div>
<div class="tabs" id="tabs"></div><div id="main"></div></div><div id="modal"></div><div class="toast" id="toast" hidden></div>
<script>
(function(){
const K="almirah_inv_v2",D=864e5,now=Date.now(),TG=45,GR=["Steel","Paint","Hardware","Glass","Packaging"];
const R=x=>(x<0?"−":"")+"₹"+Math.abs(Math.round(x)).toLocaleString("en-IN"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),$=s=>document.querySelector(s),V=i=>$("#"+i).value,N=i=>+V(i)||0,sum=(a,f)=>a.reduce((t,x)=>t+f(x),0),fd=t=>new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const I=(n,u,g,s,c,r)=>({n,u,g,s,c,r}),X=(d,l,k,a,f,g)=>({t:now-d*D,l,k,a,f,g});
const seed=()=>({cd:now-3*D,items:[I("Steel sheet 0.6 mm","kg","Steel",1200,68,400),I("Steel sheet 0.8 mm","kg","Steel",500,72,200),I("Powder coat paint","kg","Paint",24,420,25),I("Lock set","pcs","Hardware",40,85,30),I("Hinge","pcs","Hardware",160,18,100),I("Handle","pcs","Hardware",90,40,60),I("Mirror","pcs","Glass",0,250,6),I("Nuts & screws","packet","Hardware",35,60,15),I("Packing carton","pcs","Packaging",48,95,40),I("Welding rod","packet","Hardware",12,210,8)],
models:[{n:"2-Door Steel Almirah",p:9800,sold:22,b:[[0,38],[1,6],[2,1.2],[3,1],[4,4],[5,2],[7,.3],[8,1],[9,.1]]},{n:"3-Door Almirah with Mirror",p:14500,sold:9,b:[[0,55],[1,9],[2,1.8],[3,1],[4,6],[5,3],[6,1],[7,.4],[8,1],[9,.15]]},{n:"Single-Door Locker",p:5200,sold:14,b:[[0,22],[2,.7],[3,1],[4,2],[5,1],[7,.2],[8,1]]},{n:"Office File Cabinet (4 drawer)",p:7600,sold:6,b:[[0,30],[1,8],[2,1],[3,1],[5,4],[7,.3],[8,1]]}],
sup:[{n:"Shree Steel Traders",ph:"98xxx xxxxx",b:"Steel",owe:42000},{n:"Colour Coat Supplies",ph:"97xxx xxxxx",b:"Paint",owe:0},{n:"Hardware Mart",ph:"96xxx xxxxx",b:"Hardware",owe:0}],
tx:[X(20,"Rent","run",30000,"Bank"),X(18,"Salaries","run",150000,"Bank"),X(12,"Electricity","run",28000,"Bank"),X(9,"Transport","run",12000,"Cash drawer"),X(6,"Welding gas / fuel","run",6000,"Cash drawer"),X(5,"Sold scrap steel","inc",4500,"Cash drawer"),X(10,"Steel sheet 0.6 mm · Shree Steel Traders","buy",68000,"On credit","Steel"),X(7,"Powder coat paint · Colour Coat Supplies","buy",12600,"Bank","Paint"),X(4,"Hinge · Hardware Mart","buy",7200,"Cash drawer","Hardware"),X(8,"Scrap: Cut-off scrap","loss",3200),X(3,"Count shortage","loss",2400)]});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.items)S=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let T0="over",MD=null,tt;const tos=m=>{const e=$("#toast");e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2600)};
const mc=m=>sum(m.b,x=>x[1]*S.items[x[0]].c);
function calc(){const w=S.tx.filter(x=>x.t>now-30*D),by=k=>sum(w.filter(x=>x.k==k),x=>x.a);return{w,sales:sum(S.models,m=>m.p*m.sold),cogs:sum(S.models,m=>mc(m)*m.sold),run:by("run"),inc:by("inc"),loss:by("loss"),below:by("below"),buy:by("buy"),owe:sum(S.sup,s=>s.owe),val:sum(S.items,i=>i.s*i.c)}}
const st=i=>i.s<=0?["c-red","Out"]:i.r&&i.s<=i.r?["c-amber","Buy soon"]:["c-green","OK"];
const tile=(l,v,s,x,c)=>`<div class="tile"><div class="hint">${l}</div><div class="big" style="color:${c||"inherit"}">${v}</div><div class="hint">${s}</div>${x||""}</div>`;
const KL={buy:"Material cost (stock)",run:"Running cost",inc:"Other income",cash:"Drawings, not a cost",below:"Below operating profit",loss:"Loss",pay:"Clears supplier due"};
function over(){const c=calc(),p=c.sales?c.cogs/c.sales*100:0,pc=p>TG+5?"var(--rd)":p>TG?"var(--am)":"var(--gr)",low=S.items.map((x,i)=>[x,i]).filter(a=>a[0].s<=0||(a[0].r&&a[0].s<=a[0].r)),cols=["#6b4fd0","#b0567a","#22d3ee","#f5b73b","#9a95b3"];
const grp=GR.map((g,i)=>[g,sum(c.w.filter(x=>x.k=="buy"&&x.g==g),x=>x.a),cols[i]]).filter(g=>g[1]),gt=sum(grp,g=>g[1]);
let h=`<div class="card"><div style="display:flex;justify-content:space-between"><h3>Factory cost control · last 30 days</h3><span class="hint">target material cost ${TG}%</span></div><div class="tiles">`+
tile("Material cost",p.toFixed(1)+"%","of sales · target "+TG+"%",`<div class="hint">${p>TG?(p-TG).toFixed(1)+" points over target":"within target"}</div>`,pc)+
tile("Spent on stock",R(c.buy),"purchases",`<div style="display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:8px">${grp.map(g=>`<i style="width:${g[1]/gt*100}%;background:${g[2]}"></i>`).join("")}</div><div class="hint" style="font-size:11px;margin-top:4px">${grp.map(g=>g[0]+" "+Math.round(g[1]/gt*100)+"%").join(" · ")}</div>`)+
tile("Scrap & unexplained loss",R(c.loss),"scrap + count shortages",`<button class="btn g s" style="margin-top:6px" data-act="tab:loss">See why</button>`,"var(--rd)")+
tile("Stock on hand",R(c.val),low.length+" items to buy now",`<button class="btn g s" style="margin-top:6px" data-act="tab:stock">Open stock</button>`)+
tile("You owe suppliers",R(c.owe),"on credit",`<button class="btn g s" style="margin-top:6px" data-act="tab:sup">Open suppliers</button>`)+`</div></div>`;
const gp=c.sales-c.cogs,op=gp-c.run+c.inc-c.loss,net=op-c.below,ln=(l,v,col,t)=>`<div class="lr${t?" t":""}"><span>${l}</span><span class="bar"><i style="width:${Math.min(100,Math.abs(v)/(c.sales||1)*100)}%;background:${col}"></i></span><b class="r">${R(v)}</b></div>`;
h+=`<div class="card"><h3>Where every rupee went · last 30 days</h3><div style="margin-top:8px">`+ln("Sales (almirahs sold)",c.sales,"#4b3c8f")+ln("− Material cost (by bill of materials)",-c.cogs,"#b0567a")+ln("Gross profit",gp,"#6b4fd0",1)+ln("− Running costs",-c.run,"#8a5a2c")+ln("+ Other income",c.inc,"#22d3ee")+ln("− Scrap & count loss",-c.loss,"var(--rd)")+ln("Operating profit",op,"#1f9d63",1)+ln("− Loan interest & tax",-c.below,"#9a95b3")+ln("Net profit",net,"#15805a",1)+`</div></div>`;
const has=w=>S.tx.some(x=>x.t>now-30*D&&x.l.includes(w)),ck=[[1,"Sales from almirahs sold","auto from Almirah models",""],[has("Electricity"),"Electricity bill added","last 30 days","exp:2"],[has("Rent"),"Factory rent added","last 30 days","exp:0"],[has("Salaries"),"Salaries added","last 30 days","exp:1"],[now-S.cd<7*D,"Stock counted in the last 7 days","last count "+fd(S.cd),"count"],[S.tx.some(x=>x.k=="buy"&&x.t>now-3*D),"A purchase entered in the last 3 days","nothing bought? add it","buy"]],pct=Math.round(sum(ck,x=>x[0]?1:0)/ck.length*100);
h+=`<div class="g2"><div class="card"><div style="display:flex;justify-content:space-between"><h3>Books complete</h3><b style="font:700 22px 'Bricolage Grotesque',sans-serif;color:${pct>=85?"var(--gr)":"var(--am)"}">${pct}%</b></div><div class="meter"><i style="width:${pct}%"></i></div><div class="hint">The profit figure is only as true as this.</div>${ck.map(x=>`<div class="row"><b style="color:${x[0]?"var(--gr)":"var(--rd)"}">${x[0]?"✓":"✗"}</b><div>${x[1]}<small>${x[2]}</small></div>${x[0]?"<span></span>":`<button class="btn g s" data-act="m:${x[3]}">Add</button>`}</div>`).join("")}</div>`;
const na=[];low.forEach(a=>na.push([a[0].s<=0?"var(--rd)":"var(--am)",a[0].n+(a[0].s<=0?" is out":" is at reorder level"),a[0].s+" "+a[0].u+" left · reorder at "+a[0].r,"Order","m:buy:"+a[1]]));
if(p>TG)na.push(["var(--am)","Material cost "+p.toFixed(0)+"% is above your "+TG+"% target","check which almirah costs the most","See models","tab:mod"]);
S.sup.forEach((s,i)=>s.owe>0&&na.push(["#60a5fa","You owe "+s.n+" "+R(s.owe),"on credit","Mark paid","pay:"+i]));
h+=`<div class="card"><h3>Needs attention</h3><div style="margin-top:6px">${na.length?na.map(r=>`<div class="row"><span class="dot" style="background:${r[0]}"></span><div>${esc(r[1])}<small>${esc(r[2])}</small></div><button class="btn g s" data-act="${r[4]}">${r[3]}</button></div>`).join(""):'<div class="hint">All clear.</div>'}</div></div></div>`;
h+=`<div class="card"><h3>Running costs · last 30 days</h3><div style="margin-top:6px">${c.w.filter(x=>x.k=="run").sort((a,b)=>b.t-a.t).map(x=>`<div class="row"><span class="chip c-grey">${fd(x.t)}</span><div>${esc(x.l)}</div><b class="r">${R(x.a)}</b></div>`).join("")||'<div class="hint">None yet.</div>'}</div><div class="hint" style="margin-top:8px">Purchases raise stock and material cost · counts set what is really left · expenses add to running costs · all of it feeds the profit above.</div></div>`;return h}
function stock(){return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="hint">Raw material and parts in the factory</span><button class="btn" data-act="m:item">+ Add stock item</button></div><div class="tw"><table><thead><tr><th>Item</th><th>Group</th><th>Left now</th><th>vs usual stock</th><th class="r">Cost</th><th class="r">Value</th><th></th></tr></thead><tbody>${S.items.map((s,i)=>{const a=st(s),us=Math.max(s.s,s.r*3,1)*1.4,col=a[0]=="c-green"?"var(--gr)":a[0]=="c-amber"?"var(--am)":"var(--rd)";return`<tr><td>${esc(s.n)}</td><td><span class="chip c-grey">${s.g}</span></td><td><b>${+s.s.toFixed(2)} ${s.u}</b> <span class="chip ${a[0]}">${a[1]}</span></td><td><div class="bar"><i style="width:${s.s/us*100}%;background:${col}"></i></div></td><td class="r">₹${s.c}/${s.u}</td><td class="r">${R(s.s*s.c)}</td><td><button class="btn g s" data-act="m:buy:${i}">Order</button> <button class="btn g s" data-act="m:count">Count</button></td></tr>`}).join("")}</tbody></table></div></div>`}
function mod(){const c=calc(),ohr=c.sales?c.run/c.sales:0,bad=S.models.find(m=>mc(m)/m.p*100>TG);
return`<div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))"><div class="card" style="grid-column:1/-1"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Almirah models & cost · bill of materials</h3><button class="btn g s" data-act="m:model">+ Add model</button></div><div class="hint" style="margin:4px 0 8px">Actual profit per almirah = price − material cost − its share of all running costs (${(ohr*100).toFixed(1)}% of price). “+ Made &amp; sold” uses up the materials from stock.</div><div class="tw"><table><thead><tr><th>Model</th><th class="r">Sold</th><th class="r">Price</th><th class="r">Material cost</th><th class="r">Running-cost share</th><th class="r">Actual profit / piece</th><th class="r">Profit (30 days)</th><th></th></tr></thead><tbody>${S.models.map((m,i)=>{const c0=mc(m),pc=c0/m.p*100,ap=m.p-c0-m.p*ohr;return`<tr><td>${esc(m.n)}</td><td class="r">${m.sold}</td><td class="r">${R(m.p)}</td><td class="r">${R(c0)} <span class="chip ${pc>TG+5?"c-red":pc>TG?"c-amber":"c-green"}">${pc.toFixed(0)}%</span></td><td class="r">${R(m.p*ohr)}</td><td class="r"><b style="color:${ap<0?"var(--rd)":ap<m.p*.1?"var(--am)":"var(--gr)"}">${R(ap)}</b> <span class="hint">${(ap/m.p*100).toFixed(0)}%</span></td><td class="r">${R(ap*m.sold)}</td><td><button class="btn g s" data-act="sold:${i}">+ Made &amp; sold</button></td></tr>`}).join("")}</tbody></table></div></div></div>
<div class="card"><h3>Should have used vs did use</h3><div class="tiles">${tile("Bill of materials says",R(c.cogs),"should")}${tile("Books say",R(c.cogs+c.loss),"did")}${tile("Unexplained",R(c.loss),"scrap + shortages",0,"var(--rd)")}</div><div class="hint" style="margin-top:10px">${bad?esc(bad.n)+" costs "+(mc(bad)/bad.p*100).toFixed(0)+"% of its price. Consider "+R(mc(bad)/(TG/100))+", or a lighter sheet.":"All models are within the target."}</div></div>`}
function bills(){return`<div class="card"><div class="hint" style="margin-bottom:8px">Purchases, expenses, income, losses and cash taken, in one list</div><div class="tw"><table><thead><tr><th>Date</th><th>What</th><th>Counts as</th><th>Paid from</th><th class="r">Amount</th></tr></thead><tbody>${[...S.tx].sort((a,b)=>b.t-a.t).map(x=>`<tr><td>${fd(x.t)}</td><td>${esc(x.l)}</td><td>${KL[x.k]}</td><td>${x.f=="On credit"?'<span class="chip c-amber">On credit</span>':esc(x.f||"—")}</td><td class="r">${x.k=="inc"?"+":""}${R(x.a)}</td></tr>`).join("")}</tbody></table></div></div>`}
function loss(){const c=calc(),m={};c.w.filter(x=>x.k=="loss").forEach(x=>m[x.l]=(m[x.l]||0)+x.a);return`<div class="card"><h3>Losses · last 30 days</h3><div class="tw"><table style="margin-top:8px"><thead><tr><th>Kind</th><th class="r">Amount</th></tr></thead><tbody>${Object.keys(m).map(k=>`<tr><td>${esc(k)}</td><td class="r">${R(m[k])}</td></tr>`).join("")}<tr style="font-weight:700"><td>Total leaks</td><td class="r">${R(c.loss)}</td></tr></tbody></table></div><div class="hint" style="margin-top:8px">Scrap and count shortages are already taken off the profit on Overview. This list shows where they came from; it is not subtracted twice. Log scrap or count stock to add to it.</div></div>`}
function sup(){return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="hint">Who you buy from and what you owe them</span><button class="btn" data-act="m:sup">+ Add supplier</button></div><div class="tw"><table><thead><tr><th>Supplier</th><th>Phone</th><th>Supplies</th><th class="r">You owe</th><th></th></tr></thead><tbody>${S.sup.map((s,i)=>`<tr><td>${esc(s.n)}</td><td>${esc(s.ph)}</td><td>${s.b}</td><td class="r">${R(s.owe)}</td><td>${s.owe>0?`<button class="btn g s" data-act="pay:${i}">Mark paid</button>`:""}</td></tr>`).join("")}</tbody></table></div></div>`}
const KD=[["Rent","run"],["Salaries","run"],["Electricity","run"],["Water","run"],["Transport","run"],["Welding gas / fuel","run"],["Repairs & maintenance","run"],["Marketing","run"],["Software & phone","run"],["Licences & fees","run"],["Loan interest","below"],["Tax","below"],["Other income (scrap sale)","inc"],["Owner took cash","cash"]],FR=["Cash drawer","Bank / UPI","Owner pocket"];
function modal(){const q=MD.split(":"),k=q[0],x=q[1],o=(a,s)=>a.map((v,i)=>`<option value="${i}"${i==s?" selected":""}>${esc(v)}</option>`).join(""),ot=a=>a.map(v=>`<option>${esc(v)}</option>`).join(""),it=S.items.map(i=>i.n+" ("+i.u+")"),F=(l,h)=>`<div><label>${l}</label>${h}</div>`;let t,s,b,sv,bt;
if(k=="buy"){t="Record purchase";s="Stock goes up; the cost counts as material cost.";b=`<div class="f2">${F("Supplier",`<select id="ps">${o(S.sup.map(a=>a.n))}</select>`)+F("Material",`<select id="pi">${o(it,x)}</select>`)+F("Quantity",'<input id="pq" type="number" step="any" min="0">')+F("Rate per unit (₹, blank = last rate)",'<input id="pr" type="number" step="any" min="0">')+F("Paid?",`<select id="pp">${ot(["Paid now","On credit (baki)"])}</select>`)+F("Paid from",`<select id="pf">${ot(FR)}</select>`)}</div>`;sv="sbuy";bt="Save purchase"}
else if(k=="exp"){t="Add expense, income or cash taken";s="Pick what it is; it lands in the right place in the profit.";b=`<div class="f2">${F("What is it",`<select id="ek">${o(KD.map(a=>a[0]),x)}</select>`)+F("Amount (₹)",'<input id="ea" type="number" min="0" step="any">')+F("Paid from / into",`<select id="ef">${ot(FR)}</select>`)}</div>`;sv="sexp";bt="Save"}
else if(k=="count"){t="Count stock";s="Type what is really on the shelf. Differences are saved as count shortage (a loss).";b=`<div class="tw"><table><thead><tr><th>Item</th><th class="r">Book stock</th><th>Counted</th></tr></thead><tbody>${S.items.map((a,i)=>`<tr><td>${esc(a.n)}</td><td class="r">${+a.s.toFixed(2)} ${a.u}</td><td><input id="cn${i}" type="number" step="any" min="0" value="${+a.s.toFixed(2)}"></td></tr>`).join("")}</tbody></table></div>`;sv="scount";bt="Save count"}
else if(k=="scrap"){t="Log scrap";s="Material spoiled, cut off or missing. Stock goes down and it shows as a loss.";b=`<div class="f2">${F("Material",`<select id="si">${o(it)}</select>`)+F("Quantity",'<input id="sq" type="number" step="any" min="0">')+F("Reason",`<select id="sr">${ot(["Cut-off scrap","Rust / damaged","Paint defect","Missing / theft","Sample / free"])}</select>`)}</div>`;sv="sscrap";bt="Save"}
else if(k=="item"){t="Add stock item";s="Name, unit, stock and cost are enough.";b=`<div class="f2">${F("Name",'<input id="in">')+F("Unit",`<select id="iu">${ot(["kg","pcs","packet","sheet","l"])}</select>`)+F("Group",`<select id="ig">${ot(GR)}</select>`)+F("In stock now",'<input id="is" type="number" step="any" min="0" value="0">')+F("Cost per unit (₹)",'<input id="ic" type="number" step="any" min="0">')+F("Reorder at (optional)",'<input id="ir" type="number" step="any" min="0" value="0">')}</div>`;sv="sitem";bt="Add item"}
else if(k=="sup"){t="Add supplier";s="Only name and phone are needed.";b=`<div class="f2">${F("Name",'<input id="un">')+F("Phone",'<input id="up">')+F("Supplies",`<select id="ug">${ot(GR)}</select>`)}</div>`;sv="ssup";bt="Add supplier"}
else{t="Add almirah model";s="Price, and the materials per piece, one per line.";b=`<div class="f2">${F("Model name",'<input id="mn">')+F("Selling price (₹)",'<input id="mp" type="number" min="0">')}</div>${F("Bill of materials (name, quantity per piece)",'<textarea id="mb" rows="6" placeholder="Steel sheet 0.6 mm, 38&#10;Lock set, 1&#10;Hinge, 4"></textarea>')}<div class="hint">Use the exact stock item names: ${esc(S.items.map(a=>a.n).join(" · "))}</div>`;sv="smodel";bt="Add model"}
return`<div class="scrim" data-act="close"></div><div class="modal"><div style="display:flex;justify-content:space-between;gap:10px"><div><h3 style="font-size:20px">${t}</h3><div class="hint">${s}</div></div><button class="btn g s" data-act="close">✕</button></div>${b}<div style="text-align:right;margin-top:14px"><button class="btn ok" data-act="${sv}">${bt}</button></div></div>`}
const TB=[["over","Overview"],["stock","Stock"],["mod","Almirah models & cost"],["bills","Bills & expenses"],["loss","Losses"],["sup","Suppliers"]],VW={over,stock,mod,bills,loss,sup};
function render(){$("#tabs").innerHTML=TB.map(t=>`<button class="tab${T0==t[0]?" on":""}" data-act="tab:${t[0]}">${t[1]}</button>`).join("");$("#main").innerHTML=VW[T0]();$("#modal").innerHTML=MD?modal():""}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act.split(":"),k=a[0],r=a.slice(1).join(":");
if(k=="tab"){T0=r;MD=null}else if(k=="m")MD=r;else if(k=="close")MD=null;
else if(k=="reset"){if(el.dataset.c){S=seed();save();T0="over";MD=null;delete el.dataset.c;el.textContent="Reset sample data";tos("Sample data restored")}else{el.dataset.c=1;el.textContent="Tap again to confirm";return}}
else if(k=="sbuy"){const i=S.items[+V("pi")],sp=S.sup[+V("ps")],q=N("pq");if(!q)return tos("Enter a quantity");const rt=N("pr")||i.c,am=q*rt,cr=V("pp").startsWith("On");i.s+=q;i.c=rt;if(cr)sp.owe+=am;S.tx.push({t:Date.now(),l:i.n+" · "+sp.n,k:"buy",a:am,f:cr?"On credit":V("pf"),g:i.g});MD=null;tos("Purchase saved · "+i.n+" +"+q+" "+i.u+" · "+R(am))}
else if(k=="sexp"){const d=KD[+V("ek")],am=N("ea");if(!am)return tos("Enter an amount");S.tx.push({t:Date.now(),l:d[0],k:d[1],a:am,f:V("ef")});MD=null;tos("Saved · "+d[0]+" "+R(am))}
else if(k=="scount"){let n=0;S.items.forEach((i,j)=>{const v=parseFloat(V("cn"+j));if(!isNaN(v)&&v>=0&&v!=i.s){S.tx.push({t:Date.now(),l:v<i.s?"Count shortage":"Count surplus",k:"loss",a:(i.s-v)*i.c,f:"Count"});i.s=v;n++}});S.cd=Date.now();MD=null;tos("Count saved · "+n+" items adjusted")}
else if(k=="sscrap"){const i=S.items[+V("si")],q=N("sq");if(!q)return tos("Enter a quantity");i.s=Math.max(0,i.s-q);S.tx.push({t:Date.now(),l:"Scrap: "+V("sr"),k:"loss",a:q*i.c,f:"Scrap"});MD=null;tos("Scrap logged · "+R(q*i.c))}
else if(k=="sitem"){const n=V("in").trim();if(!n)return tos("Enter a name");S.items.push(I(n,V("iu"),V("ig"),N("is"),N("ic"),N("ir")));MD=null;T0="stock";tos(n+" added to stock")}
else if(k=="ssup"){const n=V("un").trim();if(!n)return tos("Enter a name");S.sup.push({n,ph:V("up")||"—",b:V("ug"),owe:0});MD=null;T0="sup";tos(n+" added")}
else if(k=="smodel"){const n=V("mn").trim(),b=[];V("mb").split("\n").forEach(l=>{const p=l.lastIndexOf(","),nm=l.slice(0,p).trim().toLowerCase(),q=parseFloat(l.slice(p+1)),j=S.items.findIndex(x=>x.n.toLowerCase()==nm);if(p>0&&j>=0&&q>0)b.push([j,q])});if(!n||!N("mp")||!b.length)return tos("Add a name, a price and at least one valid material line");S.models.push({n,p:N("mp"),sold:0,b});MD=null;T0="mod";tos(n+" added")}
else if(k=="sold"){const m=S.models[+r];m.b.forEach(x=>{const i=S.items[x[0]];i.s=Math.max(0,i.s-x[1])});m.sold++;tos("Made & sold 1 × "+m.n+" · materials used "+R(mc(m)))}
else if(k=="pay"){const s=S.sup[+r];S.tx.push({t:Date.now(),l:"Paid "+s.n,k:"pay",a:s.owe,f:"Bank / UPI"});tos(s.n+" marked paid · "+R(s.owe));s.owe=0}
else return;save();render()});
render()})();
</script></body></html>
